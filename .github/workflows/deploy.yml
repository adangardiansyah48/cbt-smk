          VITE_API_URL=https://backend-tau-one-28.vercel.app VITE_SUPABASE_URL=https://znghhzfkuxqdokokqdwr.supabase.co VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ2hoemZrdXhxZG9rb2txZHdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDU1NjcsImV4cCI6MjEwNTcyMTU2N30.bnRoyqoMEOKg8L7gaWo9IroR9lZDw1TDLaYSniv1Sio npm run build
